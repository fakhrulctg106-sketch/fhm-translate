<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FHM Translate</title>
    <meta name="description" content="Universal mobile-first translation app with floating screen translator, voice conversation, OCR camera translation, and multi-language support. Developer: Fakhrul Islam." />
    <meta property="og:title" content="FHM Translate" />
    <meta property="og:description" content="Universal mobile-first translation app with floating screen translator, voice conversation, OCR camera translation, and multi-language support. Developer: Fakhrul Islam." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #090d16;
        color: #f8fafc;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .font-display {
        font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
      }
      .initial-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #090d16;
        color: #ffffff;
        text-align: center;
        padding: 24px;
      }
      .splash-logo {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 800;
        box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
        margin-bottom: 20px;
        animation: pulse 2s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      .splash-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-top: 24px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-500 selection:text-white min-h-screen">
    <div id="root">
      <div class="initial-splash">
        <div class="splash-logo">🌐</div>
        <h1 style="font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.5px;">FHM Translate</h1>
        <p style="font-size: 13px; color: #94a3b8; margin: 6px 0 0 0;">Universal Screen & Voice Translator</p>
        <div class="splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
